<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Custom Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class=flashes>
            {% for category, message in messages %}
              <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <h1>Create Custom Page</h1>
        <form method="post">
            <label for="name">Page Title:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="content">Content (use <code>&lt;t:table_name&gt;</code> for rolls):</label><br>
            <textarea id="content" name="content" rows="10" style="width: 90%;"></textarea><br><br>

            <input type="submit" value="Create Page">
        </form>
        <br>
        <a href="{{ url_for('index') }}">Back to Home</a>
    </div>
</body>
</html>
